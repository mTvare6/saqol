[package]
name = "saq-dsp"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[features]
default = ["native"]
native = ["dep:signalsmith-stretch"]
wasm = []
cli = ["dep:clap"]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rustfft = { version = "6.4.1", default-features = false, features = ["wasm_simd"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustfft = "6.4.1"
signalsmith-stretch = { version = "0.1.3", optional = true }
